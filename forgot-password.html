<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - NexPath</title>

    <link rel="stylesheet" href="css/auth-pages.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <div class="logo">
                <span>Nex</span>Path
            </div>

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Enter your registered email address to continue.
            </p>

            <div class="info-box">
                Enter the email address you used when creating your NexPath account.
            </div>

            <form action="auth.php" method="POST">

                <input type="hidden" name="action" value="forgot">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <button type="submit">
                    Continue
                </button>

            </form>

            <p class="bottom-text">
                <a href="index.php">← Back to Login</a>
            </p>

        </div>

    </div>

</body>
</html>
